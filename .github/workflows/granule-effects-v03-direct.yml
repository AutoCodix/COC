name: Build Granule Effects v0.3 direct

on:
  push:
    branches:
      - granule-effects-v03-build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path granule-v03-direct/src | Out-Null
          $b64 = ''
          0..6 | ForEach-Object {
            $name = ('granule-v03-parts/main.{0:D2}.b64' -f $_)
            $b64 += (Get-Content -Raw $name).Trim()
          }
          [IO.File]::WriteAllBytes('granule-v03-direct/src/main.cpp', [Convert]::FromBase64String($b64))

      - name: Configure
        shell: pwsh
        run: cmake -S granule-v03-direct -B build-v03 -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build-v03 --config Release

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build-v03/Release/GranuleEffects.exe artifact/GranuleEffects-v0.3.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GranuleEffects-v0.3-win64
          path: artifact/GranuleEffects-v0.3.exe
