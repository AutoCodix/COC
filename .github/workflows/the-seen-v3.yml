name: The Seen v3 CI
on:
  push:
    branches: [the-seen-v3-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Rebuild source archive
        run: |
          cat ci.part.00 ci.part.01 ci.part.02 ci.part.03 | base64 -d > source.zip
          unzip -t source.zip
          rm -rf "$RUNNER_TEMP/the-seen-src"
          mkdir -p "$RUNNER_TEMP/the-seen-src"
          unzip -q source.zip -d "$RUNNER_TEMP/the-seen-src"
      - name: Build
        run: gradle -p "$RUNNER_TEMP/the-seen-src" build --stacktrace
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: the-seen-jars
          path: ${{ runner.temp }}/the-seen-src/build/libs/*.jar
          if-no-files-found: error
