name: Build Granule Effects v0.3

on:
  push:
    branches:
      - granule-effects-v03-build-2

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path granule-v03-direct/src | Out-Null
          $b64 = (Get-Content granule-v03-parts/main.b64.0 -Raw) + (Get-Content granule-v03-parts/main.b64.1 -Raw) + (Get-Content granule-v03-parts/main.b64.2 -Raw) + (Get-Content granule-v03-parts/main.b64.3 -Raw)
          [IO.File]::WriteAllBytes('granule-v03-direct/src/main.cpp',[Convert]::FromBase64String($b64))

      - name: Configure
        shell: pwsh
        run: |
          cmake -S granule-v03-direct -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/Release/GranuleEffects.exe artifact/GranuleEffects-v0.3.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GranuleEffects-v0.3-win64
          path: artifact/GranuleEffects-v0.3.exe
